; Seeker's Compass settings. Each section is one feature.
; Enabled is read when the game starts. Every other setting applies about a second after saving.

[Loadouts]
; Save and equip gear sets from the grace menu.
Enabled = 1

[GraceItems]
; Items found at graces set a buff you get by resting, earned with kills. Equip them from Camp
; in the grace menu. Items are defined in grace_items.txt; what each character owns is in characters\.
Enabled = 1

; 1 keeps kills you haven't banked at a grace when you die. 0 loses them.
KeepKillsOnDeath = 0

; The buff's on-screen icon. 20406 is the stat-boost icon of Exalted Flesh and the stat-knot
; Crystal Tears. Others: 20408 (Boiled Prawn), 20430 (Baldachin's Blessing),
; 20427 (Silver-Pickled Fowl Foot). 0 shows none.
BuffIcon = 20406

; Seats with a "lift" in grace_items.txt raise you onto them as you sit. Standing up steps you
; this many meters off the seat, toward the grace.
StepOff = 0.8

; 1 builds the items with no collision.
NoCollision = 1
; Degrees added to the items' facing, for models that come out turned the wrong way.
Turn = 0

; Player animations in this range count as sitting at a grace, and the one after them as resting
; (which resets the world). 68000, just below the range, is touching a grace for the first
; time and must stay out of it. Change only if a game update renumbers them.
SitAnimMin = 68010
SitAnimMax = 68049
RestAnim = 68050

; For testing: 1 gives every item in grace_items.txt.
GrantAll = 0
; For testing: 1 makes F7 count as a sit and F10 add 5 kills.
TestKeys = 0
; For testing: 1 keeps writing the player's position to position.txt.
WritePosition = 0

[DamageDial]
; Scales the damage you take from enemies. Off unless you turn it on.
Enabled = 0
; 100 = normal damage, 50 = half damage taken. Allowed: 1 to 1000.
DamageTaken = 100
; Leave at 0 unless asked. 1 shares the effect with other players, so only use it when everyone has this mod.
Sync = 0

[AutoPickup]
; Picks things up when you are in reach, without pressing the button.
Enabled = 1
; Which kinds. These apply about a second after saving.
; Plants and other crafting materials.
Materials = 1
; Items placed in the world (the glowing ones) and lootable remains.
Items = 1
Remains = 1
; What killed enemies drop.
EnemyDrops = 0
CorpseLoot = 0
; Your own runes after dying.
LostRunes = 1
; Treasure chests. A mimic chest opens the same way, so this is off.
Chests = 0
