# Seeker's Compass: the native half of the mod, one DLL for every feature that needs code in the
# game (loadouts, Grace Items, Damage Dial). See src/lib.rs.
#
# Game structures come from fromsoftware-rs (vswarte et al., MIT OR Apache-2.0 with a no-AI-training
# clause), pinned to a commit that supports Elden Ring 2.7.2.0. After a game update this one pin
# (both lines) is what gets moved to a commit that supports the new version.
[package]
name = "seekers_compass"
version = "2.0.0-alpha.1"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
eldenring = { git = "https://github.com/vswarte/fromsoftware-rs", rev = "57023153d786c4b13fe95d9170e6dcd9d35093ea" }
fromsoftware-shared = { git = "https://github.com/vswarte/fromsoftware-rs", rev = "57023153d786c4b13fe95d9170e6dcd9d35093ea" }
pelite = "0.10"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_System_SystemServices", "Win32_System_Threading", "Win32_System_Memory", "Win32_Security"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
# Panics unwind so each feature's task can catch them (see lib.rs) instead of taking the game down.
